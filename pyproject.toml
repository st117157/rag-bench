[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E,F — базовые ошибки; I — сортировка импортов; UP — современный синтаксис.
select = ["E", "F", "I", "UP", "B"]
# E501 (длинная строка) выключена: в комментариях-объяснениях
# бывают длинные фразы, и переносить их ради линтера бессмысленно.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В скриптах импорт после sys.path.insert — это норма, а не ошибка.
"eval/run_eval.py" = ["E402"]
"scripts/*.py" = ["E402"]
